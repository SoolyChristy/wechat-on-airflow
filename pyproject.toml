[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wechat-on-airflow"
version = "0.9.0"
description = "Shenzhen tennis availability alerts on Apache Airflow 3 with a PostgreSQL notification core."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "claude89757" }]
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.139.2",
  "paramiko==3.5.1",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "SQLAlchemy==2.0.54",
  "starlette==1.6.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
sender = [
  "Appium-Python-Client==5.3.1",
  "fastapi==0.139.2",
  "Pillow==13.0.0",
  "pydantic==2.13.4",
  "selenium==4.46.0",
  "uvicorn==0.51.0",
]
dev = [
  "psycopg2-binary==2.9.10",
  "types-PyYAML==6.0.12.20260815",
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
  "types-paramiko==3.5.0.20240928",
  "types-requests==2.33.0.20260712",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_airflow"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "AIR"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/host_core_production.py" = ["UP021", "UP031"]
"src/wechat_airflow/host_core/api.py" = ["B008", "F401"]
"src/wechat_airflow/host_core/domain.py" = ["UP035", "UP038"]
"src/wechat_airflow/host_core/migration.py" = ["UP038"]

[tool.mypy]
python_version = "3.12"
packages = ["wechat_airflow"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["airflow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["wechat_airflow"]
branch = true
